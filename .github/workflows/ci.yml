name: CI - Open Dental (Cloudflare & Rust)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-cloudflare:
    name: Cloudflare Edge Worker Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Run Vitest Suite (48 tests)
        run: bun run test

      - name: Test D1 Migrations
        run: echo y | bunx wrangler d1 migrations apply DB --local

  test-rust:
    name: Rust opendental-rs Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Test (34 tests)
        working-directory: rust
        run: cargo test --verbose

      - name: Build Rust CLI Binary
        working-directory: rust
        run: cargo build --verbose
