name: CI - Open Dental on Cloudflare

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Run Vitest Suite
        run: bun run test

      - name: Test D1 Migrations
        run: echo y | bunx wrangler d1 migrations apply DB --local
