[package]
name = "opendental"
version = "24.3.0"
edition = "2021"
description = "High-performance Rust implementation of Open Dental Practice Management Software"
authors = ["Brandon Hubbard <bhubbard@...>", "Open Dental Software"]
license = "GPL-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
regex = "1.10"

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
